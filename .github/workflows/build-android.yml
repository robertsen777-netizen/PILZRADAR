name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name pilzradar --org de.pilzradar .
      - name: Android permissions
        run: |
          python3 scripts/patch_android.py
      - name: Dependencies
        run: flutter pub get
      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ secrets.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PILZRADAR-Android-APK
          
      - name: Generate App Icon
        run: dart run flutter_launcher_icons

          path: build/app/outputs/flutter-apk/app-release.apk
